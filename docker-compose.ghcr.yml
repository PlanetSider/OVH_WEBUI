# OVH_WEBUI · GHCR 镜像生产部署（HTTPS + Caddy）
#
# 默认镜像：ghcr.io/planetsider/ovh-webui:latest
#
# 可通过 GHCR_OWNER / OVH_IMAGE_TAG 切换镜像命名空间或固定版本。

services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-planetsider}/ovh-webui:${OVH_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: ovh-webui-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "19998"
      LISTEN_HOST: ""
      DATA_DIR: /data
      GIN_MODE: release
      ENABLE_API_KEY_AUTH: ${ENABLE_API_KEY_AUTH:-true}
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env}
      PUBLIC_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ovh_webui_data:/data
    expose:
      - "19998"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:19998/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - ovh_net

  caddy:
    image: caddy:2.8-alpine
    container_name: ovh-webui-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile.embedded:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ovh_net

volumes:
  ovh_webui_data:
    name: ovh_webui_data
  caddy_data:
    name: ovh_webui_caddy_data
  caddy_config:
    name: ovh_webui_caddy_config

networks:
  ovh_net:
    name: ovh_webui_net
