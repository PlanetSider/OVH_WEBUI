# OVH_WEBUI 单镜像部署
# 首次使用：cp .env.example .env && 编辑三个环境变量
# 启动：docker compose pull && docker compose up -d

services:
  ovh-webui:
    image: ghcr.io/planetsider/ovh-webui:latest
    pull_policy: always
    container_name: ovh-webui
    restart: unless-stopped
    environment:
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env}
      TG_WEBHOOK_SECRET: ${TG_WEBHOOK_SECRET:-}
      TG_WEBHOOK_SECRET_OPTIONAL: ${TG_WEBHOOK_SECRET_OPTIONAL:-false}
    ports:
      - "19998:19998"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:19998/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
